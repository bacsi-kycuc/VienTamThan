<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏥 Bệnh viện Tâm thần Đa khoa Kỹ Thuật Số</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --bg2: #f1f5f9;
    --bg3: #e2e8f0;
    --card: #ffffff;
    --border: #cbd5e1;
    --border2: #94a3b8;
    --primary: #7c3aed;
    --primary-light: #a78bfa;
    --accent: #f43f5e;
    --success: #10b981;
    --text: #1e293b;
    --text-muted: #64748b;
    --radius: 20px;
    --radius-sm: 12px;
    --shadow: 0 10px 25px rgba(124, 58, 237, 0.05);
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
  body { background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; }

  /* MÀN HÌNH CHÀO MỪNG - GAM MÀU PASTEL ĐÁNG YÊU, XINH XẮN */
  #welcomeScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #fef08a 0%, #fbcfe8 50%, #e9d5ff 100%);
    z-index: 9999; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    padding: 20px; 
    transition: var(--transition);
  }
  #welcomeScreen.hidden { opacity: 0; pointer-events: none; transform: scale(1.02); }
  
  .welcome-title-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 12px;
  }
  .welcome-icon {
    font-size: 3rem;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
  }
  .welcome-title { 
    font-family: 'Comfortaa', cursive; 
    font-size: 2.3rem; 
    font-weight: 700;
    background: linear-gradient(135deg, #6d28d9, #db2777);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center; 
  }
  .welcome-subtitle { 
    color: #6d28d9; 
    font-family: 'Comfortaa', cursive;
    font-size: 1.1rem; 
    font-weight: 500;
    margin-bottom: 40px; 
    text-align: center; 
    opacity: 0.8;
  }
  
  .zone-selection-container { 
    display: flex; 
    gap: 25px; 
    max-width: 800px; 
    width: 100%; 
    justify-content: center; 
    flex-wrap: wrap; 
    margin-bottom: 35px;
  }
  
  .zone-card { 
    border-radius: 24px; 
    padding: 30px 20px; 
    width: 250px; 
    text-align: center; 
    cursor: pointer; 
    transition: var(--transition); 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    position: relative;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(10px);
    border: 3px solid transparent;
  }
  
  .zone-card.hospital-theme {
    border-color: #a78bfa;
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.1);
  }
  .zone-card.hospital-theme:hover {
    transform: translateY(-8px);
    background: #ffffff;
    box-shadow: 0 15px 30px rgba(124, 58, 237, 0.2);
  }
  .zone-card.hospital-theme h3 {
    color: #6d28d9;
    font-family: 'Comfortaa', cursive;
    font-size: 1.3rem;
    font-weight: 700;
    margin-top: 10px;
  }

  .zone-card.cainghien-theme {
    border-color: #f43f5e;
    box-shadow: 0 8px 20px rgba(244, 63, 94, 0.1);
  }
  .zone-card.cainghien-theme:hover {
    transform: translateY(-8px);
    background: #ffffff;
    box-shadow: 0 15px 30px rgba(244, 63, 94, 0.2);
  }
  .zone-card.cainghien-theme h3 {
    color: #e11d48;
    font-family: 'Comfortaa', cursive;
    font-size: 1.3rem;
    font-weight: 700;
    margin-top: 10px;
  }

  .zone-card .icon { 
    font-size: 3.5rem; 
    transition: var(--transition);
  }
  .zone-card:hover .icon {
    transform: scale(1.15) rotate(5deg);
  }

  .social-links-container {
    display: flex;
    gap: 15px;
    justify-content: center;
    width: 100%;
    max-width: 525px;
  }
  .btn-social {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 20px;
    border-radius: 16px;
    font-family: 'Comfortaa', cursive;
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
    transition: var(--transition);
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }
  .btn-discord { background: #5865F2; color: white; }
  .btn-discord:hover { background: #4752c4; transform: translateY(-2px); }
  .btn-facebook { background: #1877F2; color: white; }
  .btn-facebook:hover { background: #1664d4; transform: translateY(-2px); }

  /* GIAO DIỆN HỆ THỐNG CHÍNH */
  #app { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; }
  #app.active { display: block; }

  header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
  .brand-zone-info { display: flex; align-items: center; gap: 20px; }
  .logo-title h1 { font-family: 'Comfortaa', cursive; font-size: 1.3rem; color: var(--primary); font-weight: 700; }

  .zone-slider-wrapper { background: var(--bg3); padding: 4px; border-radius: 30px; display: flex; position: relative; width: 320px; user-select: none; cursor: pointer; }
  .zone-slider-btn { flex: 1; text-align: center; padding: 10px 0; font-weight: 700; font-size: 0.9rem; z-index: 2; transition: var(--transition); color: var(--text-muted); }
  .zone-slider-btn.active { color: white; }
  .zone-slider-bg { position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px); background: var(--primary); border-radius: 26px; z-index: 1; transition: var(--transition); }
  .zone-slider-wrapper.active-cai-nghien .zone-slider-bg { left: calc(50%); background: var(--accent); }

  .user-actions { display: flex; align-items: center; gap: 15px; }
  .btn { padding: 10px 20px; border-radius: var(--radius-sm); border: none; font-weight: 700; cursor: pointer; transition: var(--transition); }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-outline { background: transparent; border: 1px solid var(--border2); color: var(--text); }
  .btn-outline:hover { background: var(--bg2); }
  .btn-danger { background: var(--accent); color: white; }

  .main-layout { display: grid; grid-template-columns: 300px 1fr; gap: 30px; }
  @media(max-width: 768px) { .main-layout { grid-template-columns: 1fr; } }

  .sidebar { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); align-self: start; }
  .sidebar h2 { font-size: 1.1rem; margin-bottom: 15px; color: var(--text-muted); font-weight: 700; }
  .genre-list { display: flex; flex-direction: column; gap: 8px; }
  .genre-item { padding: 12px 15px; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); font-weight: 600; display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .genre-item:hover, .genre-item.active { background: var(--bg2); color: var(--primary); }

  .content-area { display: flex; flex-direction: column; gap: 20px; }
  .search-bar { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 20px; box-shadow: var(--shadow); display: flex; gap: 15px; }
  .search-bar input { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; font-size: 1rem; }

  .prompt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .prompt-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); transition: var(--transition); cursor: pointer; position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
  .prompt-card:hover { transform: translateY(-4px); border-color: var(--border2); }
  .prompt-card h3 { font-size: 1.2rem; color: var(--text); padding-right: 80px; line-height: 1.4; font-weight: 700; }
  .prompt-card p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; }
  
  .tag-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .tag-badge { background: #e2e8f0; color: #475569; font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; font-weight: 600; }

  .zone-badge { position: absolute; top: 20px; right: 20px; font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; font-weight: 700; text-transform: uppercase; }
  .zone-badge.hospital { background: #e0f2fe; color: var(--primary); }
  .zone-badge.cai-nghien { background: #ffe4e6; color: var(--accent); }

  /* MODALS */
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.2); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: var(--transition); padding: 15px; }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal-content { background: var(--card); border-radius: var(--radius); padding: 30px; width: 100%; max-width: 520px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); position: relative; transform: scale(0.95); transition: var(--transition); max-height: 90vh; overflow-y: auto; }
  .modal.show .modal-content { transform: scale(1); }
  .modal-header { font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; font-family: 'Comfortaa', cursive; }
  .close-modal { cursor: pointer; font-size: 1.5rem; color: var(--text-muted); }

  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.9rem; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; font-size: 0.95rem; }
  .radio-group-zone { display: flex; gap: 20px; margin-top: 5px; }
  .radio-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600 !important; }
  .radio-label input { width: auto; cursor: pointer; }

  .error-msg { color: var(--accent); font-size: 0.85rem; margin-top: 5px; display: none; }
  .error-msg.show { display: block; }
  .hint-box { background: #fffbeb; border: 1px dashed #f59e0b; padding: 12px; border-radius: var(--radius-sm); color: #b45309; font-size: 0.9rem; margin-bottom: 15px; line-height: 1.4; }
</style>
</head>
<body>

  <div id="welcomeScreen">
    <div class="welcome-title-container">
      <span class="welcome-icon">🏥</span>
      <h1 class="welcome-title">VIỆN TÂM THẦN ĐA KHOA KỸ THUẬT SỐ</h1>
    </div>
    <p class="welcome-subtitle">Chào mừng các bệnh nhân đến với viện tâm thần Cố Thị</p>
    
    <div class="zone-selection-container">
      <div class="zone-card hospital-theme" onclick="selectInitialZone('hospital')">
        <div class="icon">🏥</div>
        <h3>Khu Bệnh Viện</h3>
      </div>
      
      <div class="zone-card cainghien-theme" onclick="selectInitialZone('cai-nghien')">
        <div class="icon">💊</div>
        <h3>Trại Cai Nghiện</h3>
      </div>
    </div>

    <div class="social-links-container">
      <a id="welcomeDiscordBtn" href="#" target="_blank" class="btn-social btn-discord" style="display: none;">💬 Kết nối Discord</a>
      <a id="welcomeFacebookBtn" href="#" target="_blank" class="btn-social btn-facebook" style="display: none;">👍 Kết nối Facebook</a>
    </div>
  </div>

  <div id="app">
    <header>
      <div class="brand-zone-info">
        <div class="logo-title">
          <h1>🏥 VIỆN TÂM THẦN CỐ THỊ</h1>
        </div>
        <div class="zone-slider-wrapper" id="zoneSlider" onclick="toggleZoneSlider()">
          <div class="zone-slider-btn id-hospital active" id="btnSliderHospital">🏥 Bệnh Viện</div>
          <div class="zone-slider-btn id-cainghien" id="btnSliderCaiNghien">💊 Trại Cai Nghiện</div>
          <div class="zone-slider-bg"></div>
        </div>
      </div>

      <div class="user-actions">
        <span id="adminBadge" style="display:none; background: #fef3c7; color: #d97706; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; margin-right: 5px;">👑 ADMIN</span>
        <button class="btn btn-outline" id="configLinksBtn" style="display:none; margin-right:5px; background:#f3e8ff; border-color:#c084fc; color:#6d28d9;" onclick="openModal('linksConfigModal')">🔗 Quản lý Link</button>
        <button class="btn btn-outline" id="loginBtn" onclick="openModal('loginModal')">⚙ Admin</button>
        <button class="btn btn-primary" id="adminPanelBtn" style="display:none;" onclick="openModal('promptModal')">+ Thêm Bệnh Án</button>
        <button
