<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏥 Bệnh viện Tâm thần Đa khoa Kỹ Thuật Số</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4f8;
    --bg2: #e8f0f7;
    --bg3: #dce7f3;
    --card: #ffffff;
    --border: #b8d4e8;
    --border2: #a0c8e0;
    --primary: #0066cc;
    --primary-light: #1a7ee8;
    --accent: #d63031;
    --success: #00a854;
    --text: #1e293b;
    --text-muted: #64748b;
    --radius: 16px;
    --radius-sm: 8px;
    --shadow: 0 4px 20px rgba(0,0,0,0.05);
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; }

  /* MÀN HÌNH CHÀO MỪNG (THEMING PHỐI HỢP SÁNG - TỐI, MÀU MÈ RỰC RỠ) */
  #welcomeScreen {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    /* Nền không gian tối sâu thẳm hòa trộn ánh đèn mờ ảo */
    background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
    z-index: 9999; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    padding: 20px; 
    transition: var(--transition);
  }
  #welcomeScreen.hidden { opacity: 0; pointer-events: none; transform: scale(1.02); }
  
  .welcome-title { 
    font-family: 'Playfair Display', serif; 
    font-size: 2.8rem; 
    /* Đổi hiệu ứng chữ đổ màu ánh kim Neon */
    background: linear-gradient(135deg, #38bdf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center; 
    margin-bottom: 12px; 
    filter: drop-shadow(0 2px 8px rgba(192, 132, 252, 0.3));
  }
  /* Cập nhật dòng chữ custom theo ý bạn */
  .welcome-subtitle { 
    color: #94a3b8; 
    font-size: 1.25rem; 
    font-weight: 500;
    margin-bottom: 50px; 
    text-align: center; 
    letter-spacing: 0.5px;
  }
  
  .zone-selection-container { 
    display: flex; 
    gap: 35px; 
    max-width: 900px; 
    width: 100%; 
    justify-content: center; 
    flex-wrap: wrap; 
  }
  
  /* CÁC THẺ CARD ĐÃ TỐI GIẢN CHỮ - CHỈ CÓ ICON VÀ TÊN */
  .zone-card { 
    border-radius: 28px; 
    padding: 50px 40px; 
    width: 320px; 
    text-align: center; 
    cursor: pointer; 
    transition: var(--transition); 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  
  /* Card Khu Bệnh Viện: Tone Sáng pha Neon xanh biển */
  .zone-card.hospital-theme {
    background: linear-gradient(135deg, #ffffff 0%, #e0f2fe 100%);
    border: 3px solid #38bdf8;
    box-shadow: 0 8px 30px rgba(56, 189, 248, 0.2);
  }
  .zone-card.hospital-theme:hover {
    transform: translateY(-10px);
    box-shadow: 0 15px 40px rgba(56, 189, 248, 0.4);
  }
  .zone-card.hospital-theme h3 {
    color: #0369a1;
    font-size: 1.8rem;
    font-weight: 800;
  }

  /* Card Trại Cai Nghiện: Tone Tối Huyền Bí pha Neon Đỏ Hồng cực cháy */
  .zone-card.cainghien-theme {
    background: linear-gradient(135deg, #1e293b 0%, #4c0519 100%);
    border: 3px solid #f43f5e;
    box-shadow: 0 8px 30px rgba(244, 63, 94, 0.3);
  }
  .zone-card.cainghien-theme:hover {
    transform: translateY(-10px);
    box-shadow: 0 15px 40px rgba(244, 63, 94, 0.6);
  }
  .zone-card.cainghien-theme h3 {
    color: #fff;
    font-size: 1.8rem;
    font-weight: 800;
    text-shadow: 0 2px 10px rgba(244, 63, 94, 0.5);
  }

  .zone-card .icon { 
    font-size: 5rem; 
    margin-bottom: 15px; 
    transition: var(--transition);
  }
  .zone-card:hover .icon {
    transform: scale(1.15);
  }

  /* GIAO DIỆN HỆ THỐNG CHÍNH */
  #app { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; }
  #app.active { display: block; }

  header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
  .brand-zone-info { display: flex; align-items: center; gap: 20px; }
  .logo-title h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--primary); }

  /* TOGGLE SLIDER KHU VỰC */
  .zone-slider-wrapper { background: var(--bg3); padding: 4px; border-radius: 30px; display: flex; position: relative; width: 320px; user-select: none; cursor: pointer; }
  .zone-slider-btn { flex: 1; text-align: center; padding: 10px 0; font-weight: 600; font-size: 0.9rem; z-index: 2; transition: var(--transition); color: var(--text-muted); }
  .zone-slider-btn.active { color: white; }
  .zone-slider-bg { position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px); background: var(--primary); border-radius: 26px; z-index: 1; transition: var(--transition); }
  .zone-slider-wrapper.active-cai-nghien .zone-slider-bg { left: calc(50%); background: var(--accent); }

  .user-actions { display: flex; align-items: center; gap: 15px; }
  .btn { padding: 10px 20px; border-radius: var(--radius-sm); border: none; font-weight: 600; cursor: pointer; transition: var(--transition); }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-outline { background: transparent; border: 1px solid var(--border2); color: var(--text); }
  .btn-outline:hover { background: var(--bg2); }
  .btn-danger { background: var(--accent); color: white; }

  .main-layout { display: grid; grid-template-columns: 300px 1fr; gap: 30px; }
  @media(max-width: 768px) { .main-layout { grid-template-columns: 1fr; } }

  .sidebar { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); align-self: start; }
  .sidebar h2 { font-size: 1.1rem; margin-bottom: 15px; color: var(--text-muted); font-weight: 700; }
  .genre-list { display: flex; flex-direction: column; gap: 8px; }
  .genre-item { padding: 12px 15px; border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); font-weight: 500; display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .genre-item:hover, .genre-item.active { background: var(--bg2); color: var(--primary); }

  .content-area { display: flex; flex-direction: column; gap: 20px; }
  .search-bar { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 20px; box-shadow: var(--shadow); display: flex; gap: 15px; }
  .search-bar input { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; font-size: 1rem; }

  /* PROMPT CARDS */
  .prompt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .prompt-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); transition: var(--transition); cursor: pointer; position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
  .prompt-card:hover { transform: translateY(-4px); border-color: var(--border2); }
  .prompt-card h3 { font-size: 1.2rem; color: var(--text); padding-right: 80px; line-height: 1.4; }
  .prompt-card p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; }
  
  /* TAGS STYLE */
  .tag-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .tag-badge { background: #e2e8f0; color: #475569; font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; font-weight: 500; }

  .zone-badge { position: absolute; top: 20px; right: 20px; font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; font-weight: 700; text-transform: uppercase; }
  .zone-badge.hospital { background: #e0f2fe; color: var(--primary); }
  .zone-badge.cai-nghien { background: #ffe4e6; color: var(--accent); }
