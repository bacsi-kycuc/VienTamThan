<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏥 Bệnh viện Tâm thần Đa khoa Kỹ Thuật Số</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600;700&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --bg2: #151b24;
    --bg3: #1a2332;
    --card: #1e2838;
    --card2: #2a3a4f;
    --border: #2d3f52;
    --border2: #3d5066;
    --primary: #00d4ff;
    --primary-light: #4dd9ff;
    --accent: #ff006b;
    --accent-light: #ff4da6;
    --success: #00d97e;
    --warning: #ffa500;
    --danger: #ff4757;
    --text: #e8f0f7;
    --text2: #b0bcc4;
    --text3: #7a8893;
    --text-dark: #4a5a6a;
    --radius: 14px;
    --glow: 0 0 20px rgba(0,212,255,0.2);
    --glow-danger: 0 0 20px rgba(255,0,107,0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    min-height: 100vh;
    overflow-x: hidden;
    letter-spacing: 0.3px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 20% 50%, rgba(0,212,255,0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,0,107,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .bg-orbs {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.08;
    animation: drift 25s ease-in-out infinite;
  }
  .orb1 { width: 600px; height: 600px; background: var(--primary); top: -200px; left: -100px; animation-delay: 0s; }
  .orb2 { width: 400px; height: 400px; background: var(--accent); bottom: -100px; right: -100px; animation-delay: -8s; }
  .orb3 { width: 300px; height: 300px; background: var(--success); top: 40%; left: 60%; animation-delay: -15s; }
  
  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -20px) scale(1.05); }
    66% { transform: translate(-20px, 30px) scale(0.95); }
  }

  #app { position: relative; z-index: 1; }

  header {
    padding: 28px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--border);
    backdrop-filter: blur(20px);
    background: rgba(15,20,25,0.8);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 30px rgba(0,212,255,0.08);
  }

  .logo-wrap { display: flex; align-items: center; gap: 16px; }
  
  .logo-icon {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    box-shadow: 0 0 30px rgba(0,212,255,0.4), inset 0 0 20px rgba(255,255,255,0.1);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 30px rgba(0,212,255,0.4), inset 0 0 20px rgba(255,255,255,0.1); }
    50% { box-shadow: 0 0 50px rgba(0,212,255,0.6), inset 0 0 30px rgba(255,255,255,0.15); }
  }

  .logo-text {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--primary-light), var(--accent-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
    line-height: 1.2;
  }

  .logo-sub { 
    font-size: 11px; 
    color: var(--text3); 
    font-family: 'JetBrains Mono', monospace; 
    letter-spacing: 2px; 
    text-transform: uppercase;
    font-weight: 600;
  }
  
  .header-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 10px 18px;
    border-radius: 10px;
    border: 1.5px solid var(--border2);
    background: rgba(30,40,56,0.6);
    color: var(--text);
    font-family: 'Fredoka', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn:hover { 
    background: var(--card2);
    border-color: var(--primary);
    color: var(--primary-light);
    box-shadow: 0 0 20px rgba(0,212,255,0.2);
    transform: translateY(-2px);
  }

  .btn-gold {
    background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(0,212,255,0.05));
    border-color: var(--primary);
    color: var(--primary-light);
  }

  .btn-gold:hover { 
    background: linear-gradient(135deg, rgba(0,212,255,0.25), rgba(0,212,255,0.15));
    box-shadow: var(--glow), 0 8px 30px rgba(0,212,255,0.2);
  }

  .btn-danger { 
    border-color: var(--danger); 
    color: var(--accent-light); 
    background: rgba(255,71,87,0.1);
  }

  .btn-danger:hover { 
    background: rgba(255,71,87,0.2); 
    border-color: var(--accent-light);
    box-shadow: var(--glow-danger);
  }

  .btn-sm { padding: 7px 14px; font-size: 12px; }
  .btn-icon { padding: 8px; }

  main { padding: 40px; max-width: 1400px; margin: 0 auto; }

  .filter-bar {
    display: flex; gap: 14px; align-items: center;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative; flex: 1; min-width: 220px;
  }

  .search-wrap .icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: var(--text3); font-size: 16px; pointer-events: none;
  }

  input[type="text"], input[type="password"], input[type="email"], textarea, select {
    background: rgba(30,40,56,0.5);
    border: 1.5px solid var(--border2);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Fredoka', sans-serif;
    font-size: 15px;
    padding: 12px 16px;
    width: 100%;
    transition: all 0.3s;
    outline: none;
  }

  input[type="text"]:focus, input[type="password"]:focus, input[type="email"]:focus, textarea:focus, select:focus {
    border-color: var(--primary);
    background: rgba(30,40,56,0.8);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.1), inset 0 0 20px rgba(0,212,255,0.05);
  }

  .search-wrap input { padding-left: 48px; }
  select { appearance: none; cursor: pointer; }

  .section-header {
    display: flex; align-items: baseline; gap: 14px;
    margin-bottom: 24px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 900;
    color: var(--primary-light);
    letter-spacing: -0.5px;
  }

  .count-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--primary-light);
    background: rgba(0,212,255,0.15);
    border: 1px solid var(--primary);
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 700;
  }

  .prompts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
  }

  .prompt-card {
    background: linear-gradient(135deg, rgba(30,40,56,0.4) 0%, rgba(42,58,79,0.2) 100%);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: visible;
    animation: fadeUp 0.5s ease both;
  }

  .prompt-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    opacity: 0;
    background: linear-gradient(135deg, rgba(0,212,255,0.1) 0%, rgba(255,0,107,0.05) 100%);
    transition: opacity 0.3s;
    pointer-events: none;
  }

  .prompt-card:hover { 
    border-color: var(--primary);
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,212,255,0.15), var(--glow);
    background: linear-gradient(135deg, rgba(0,212,255,0.08) 0%, rgba(0,212,255,0.04) 100%);
  }

  .prompt-card:hover::before { opacity: 1; }

  .card-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 12px; gap: 12px;
  }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--primary-light);
    line-height: 1.4;
    flex: 1;
  }

  .lock-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--danger);
    background: rgba(255,71,87,0.15);
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 600;
    white-space: nowrap;
  }

  .card-desc {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.6;
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-weight: 400;
  }

  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  
  .tag-pill {
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 12px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.2px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .tag-pill.genre { 
    background: rgba(0,212,255,0.15); 
    border: 1px solid rgba(0,212,255,0.4); 
    color: var(--primary-light);
  }

  .tag-pill.tag { 
    background: rgba(255,0,107,0.15); 
    border: 1px solid rgba(255,0,107,0.4); 
    color: var(--accent-light);
  }

  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(12px);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    animation: fadeIn 0.3s ease;
    overflow-y: auto;
  }

  .modal-bg.hidden { display: none; }
  
  .modal {
    background: linear-gradient(135deg, rgba(21,27,36,0.95) 0%, rgba(26,35,50,0.95) 100%);
    border: 2px solid var(--primary);
    border-radius: 20px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0,212,255,0.2), var(--glow);
    animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .modal-lg { max-width: 720px; }
  
  .modal-header {
    padding: 28px;
    border-bottom: 2px solid var(--primary);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, rgba(0,212,255,0.08) 0%, transparent 100%);
  }

  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--primary-light);
  }

  .modal-body { padding: 28px; }
  
  .modal-footer {
    padding: 20px 28px 28px;
    display: flex; gap: 12px; justify-content: flex-end;
    border-top: 2px solid var(--primary);
    background: linear-gradient(135deg, rgba(0,212,255,0.04) 0%, transparent 100%);
  }

  .close-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(30,40,56,0.6); border: 1.5px solid var(--border2);
    color: var(--text3); cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
    font-weight: 700;
  }

  .close-btn:hover { 
    background: rgba(255,71,87,0.15);
    color: var(--danger); 
    border-color: var(--danger);
  }

  .form-group { margin-bottom: 20px; }
  
  .form-label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--primary-light);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .form-hint { font-size: 12px; color: var(--text3); margin-top: 6px; font-weight: 500; }
  textarea { resize: vertical; min-height: 100px; line-height: 1.6; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  
  .tags-input-wrap { display: flex; gap: 8px; }
  .tags-input-wrap input { flex: 1; }
  .tags-preview { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  
  .tag-removable {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; padding: 4px 12px; border-radius: 12px;
    font-family: 'JetBrains Mono', monospace;
    cursor: default;
    font-weight: 600;
  }

  .tag-removable .rm { cursor: pointer; opacity: 0.6; font-size: 14px; line-height: 1; transition: opacity 0.2s; }
  .tag-removable .rm:hover { opacity: 1; }
  
  .tag-removable.genre { 
    background: rgba(0,212,255,0.15); 
    border: 1px solid rgba(0,212,255,0.3); 
    color: var(--primary-light);
  }

  .tag-removable.tag { 
    background: rgba(255,0,107,0.15); 
    border: 1px solid rgba(255,0,107,0.3); 
    color: var(--accent-light);
  }

  .pw-section {
    background: rgba(0,212,255,0.08);
    border: 1.5px solid var(--primary);
    border-radius: 12px;
    padding: 18px;
    margin-top: 18px;
  }

  .pw-toggle {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    color: var(--text); font-size: 14px;
    user-select: none;
    font-weight: 600;
  }

  .pw-toggle input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
  .pw-fields { margin-top: 14px; display: flex; flex-direction: column; gap: 12px; }
  .pw-fields.hidden { display: none; }

  .security-note {
    background: rgba(0,217,126,0.1);
    border: 1.5px solid var(--success);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 12px;
    color: var(--success);
    margin-top: 10px;
    font-weight: 600;
  }

  .unlock-modal .lock-big { font-size: 56px; text-align: center; margin-bottom: 14px; }
  
  .unlock-modal .hint-text {
    text-align: center;
    font-size: 13px;
    color: var(--accent-light);
    font-family: 'JetBrains Mono', monospace;
    background: rgba(255,0,107,0.1);
    border: 1.5px solid var(--accent);
    padding: 10px 16px;
    border-radius: 10px;
    margin-bottom: 18px;
    font-weight: 600;
  }

  .pw-input-wrap { position: relative; }
  .pw-input-wrap input { padding-right: 44px; letter-spacing: 2px; font-family: 'JetBrains Mono', monospace; }
  
  .pw-toggle-vis {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text3); cursor: pointer;
    font-size: 16px; padding: 4px; transition: all 0.2s; font-weight: 700;
  }

  .pw-toggle-vis:hover { color: var(--primary); }
  .pw-error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; font-weight: 600; }
  .pw-error.show { display: block; }

  .prompt-text-display {
    background: rgba(30,40,56,0.6);
    border: 1.5px solid var(--border2);
    border-radius: 10px;
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 300px;
    overflow-y: auto;
  }

  .empty-state {
    text-align: center;
    padding: 100px 20px;
    color: var(--text3);
  }

  .empty-state .empty-icon { font-size: 64px; margin-bottom: 18px; opacity: 0.4; }
  
  .empty-state h3 { 
    font-family: 'Playfair Display', serif; 
    font-size: 20px; 
    font-weight: 700;
    color: var(--text2); 
    margin-bottom: 8px; 
  }

  .empty-state p { font-size: 14px; font-weight: 500; }

  .toast {
    position: fixed;
    bottom: 30px; right: 30px;
    background: linear-gradient(135deg, rgba(30,40,56,0.95) 0%, rgba(42,58,79,0.95) 100%);
    border: 2px solid var(--primary);
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 14px;
    color: var(--text);
    z-index: 999;
    box-shadow: 0 12px 40px rgba(0,212,255,0.2), var(--glow);
    animation: slideUp 0.3s ease;
    display: flex; align-items: center; gap: 12px;
    max-width: 320px;
    font-weight: 600;
  }

  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }
  .toast-icon { font-size: 20px; font-weight: 700; }
  .toast.fade-out { animation: fadeOut 0.3s ease forwards; }

  .admin-status {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--primary-light);
    font-weight: 600;
  }

  .admin-badge {
    background: rgba(0,212,255,0.2);
    border: 1px solid var(--primary);
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 11px;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeOut { to { opacity: 0; transform: translateY(-8px); } }

  @media (max-width: 640px) {
    header { padding: 20px 24px; }
    main { padding: 24px 20px; }
    .form-row { grid-template-columns: 1fr; }
    .logo-text { font-size: 18px; }
    .section-title { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div id="app">
  <header>
    <div class="logo-wrap">
      <div class="logo-icon">🏥</div>
      <div>
        <div class="logo-text">Bệnh viện Tâm thần<br>Đa khoa Kỹ Thuật Số</div>
        <div class="logo-sub">⚡ Viện Tâm Thần Cố Thị ⚡</div>
      </div>
    </div>
    <div class="header-actions">
      <div id="adminStatusInfo" class="admin-status" style="display:none">
        <span id="adminEmail"></span>
        <span class="admin-badge">👑 ADMIN</span>
      </div>
      <button class="btn btn-gold" id="adminBtn" onclick="toggleAdminPanel()">⚙ Admin</button>
    </div>
  </header>

  <main>
    <div class="filter-bar">
      <div class="search-wrap">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Tìm kiếm prompts..." oninput="renderPrompts()">
      </div>
      <select id="sortSelect" onchange="renderPrompts()" style="width:auto;min-width:150px">
        <option value="newest">🆕 Mới nhất</option>
        <option value="oldest">🕰️ Cũ nhất</option>
        <option value="name">🔤 Tên A–Z</option>
      </select>
    </div>

    <!-- RESULTS -->
    <div class="section-header">
      <span class="section-title">💊 Khu Prompts</span>
      <span class="count-badge" id="countBadge">0</span>
    </div>

    <div class="prompts-grid" id="promptsGrid"></div>
  </main>
</div>

<!-- ADMIN LOGIN MODAL -->
<div class="modal-bg hidden" id="adminLoginModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">👑 Đăng Nhập Admin</span>
      <button class="close-btn" onclick="closeAdminLoginModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Email Admin</label>
        <input type="email" id="adminEmailInput" placeholder="your@email.com">
        <div class="form-hint">📧 Xác nhận bằng email của bạn</div>
      </div>
      <div class="form-group">
        <label class="form-label">Mật Khẩu Master</label>
        <div class="pw-input-wrap">
          <input type="password" id="adminPasswordInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')loginAdmin()">
          <button class="pw-toggle-vis" onclick="togglePwVis('adminPasswordInput',this)">👁</button>
        </div>
        <div class="pw-error" id="adminLoginError"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeAdminLoginModal()">Hủy</button>
      <button class="btn btn-gold" onclick="loginAdmin()">Đăng Nhập</button>
    </div>
  </div>
</div>

<!-- ADMIN PANEL MODAL -->
<div class="modal-bg hidden" id="adminPanelModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title">⚙ Bảng Điều Khiển Admin</span>
      <button class="close-btn" onclick="closeAdminPanel()">✕</button>
    </div>
    <div class="modal-body">
      <div class="section-header" style="margin-bottom:16px">
        <span class="section-title" style="font-size:18px">✨ Thêm / Chỉnh Sửa Prompt</span>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Tên Prompt *</label>
          <input type="text" id="fName" placeholder="Ví dụ: ChatGPT Pro">
        </div>
        <div class="form-group">
          <label class="form-label">Link / Text *</label>
          <input type="text" id="fLink" placeholder="https://... hoặc paste text">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Mô Tả</label>
        <textarea id="fDesc" placeholder="Mô tả chi tiết..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Thể Loại (Genre)</label>
          <div class="tags-input-wrap">
            <input type="text" id="fGenreInput" placeholder="AI, Marketing..." onkeydown="handleTagKey(event,'genre')">
            <button class="btn btn-sm" onclick="addTag('genre')">＋</button>
          </div>
          <div class="tags-preview" id="fGenrePrev"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Tags</label>
          <div class="tags-input-wrap">
            <input type="text" id="fTagInput" placeholder="Tag1, Tag2..." onkeydown="handleTagKey(event,'tag')">
            <button class="btn btn-sm" onclick="addTag('tag')">＋</button>
          </div>
          <div class="tags-preview" id="fTagPrev"></div>
        </div>
      </div>
      <div class="pw-section">
        <label class="pw-toggle">
          <input type="checkbox" id="fPwEnabled" onchange="togglePwFields()">
          <span>🔐 Bảo vệ bằng mật khẩu</span>
        </label>
        <div class="pw-fields hidden" id="pwFields">
          <div class="form-group" style="margin:0">
            <label class="form-label">Mật Khẩu</label>
            <input type="text" id="fPassword" placeholder="Nhập mật khẩu...">
          </div>
          <div class="form-group" style="margin:0">
            <label class="form-label">Gợi Ý (Hint)</label>
            <input type="text" id="fHint" placeholder="Ví dụ: Tên con mèo 🐱">
          </div>
          <div class="security-note">✓ Mật khẩu được mã hóa AES-256. An toàn 100%!</div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" onclick="logoutAdmin()" id="logoutBtn">🚪 Đăng Xuất</button>
      <button class="btn" onclick="clearAdminForm()" id="clearBtn">🗑 Xóa Form</button>
      <button class="btn" onclick="closeAdminPanel()">Hủy</button>
      <button class="btn btn-gold" onclick="savePrompt()" id="saveBtnAdmin">💾 Lưu Prompt</button>
    </div>
  </div>
</div>

<!-- UNLOCK MODAL -->
<div class="modal-bg hidden" id="unlockModal">
  <div class="modal unlock-modal">
    <div class="modal-header">
      <span class="modal-title">🔐 Nhập Mật Khẩu</span>
      <button class="close-btn" onclick="closeUnlockModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="lock-big">🔒</div>
      <p style="text-align:center;color:var(--text2);margin-bottom:16px;font-weight:600" id="unlockBotName">...</p>
      <div id="unlockHintWrap" class="hint-text" style="display:none"></div>
      <div class="form-group">
        <label class="form-label">Mật Khẩu</label>
        <div class="pw-input-wrap">
          <input type="password" id="unlockInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')tryUnlock()">
          <button class="pw-toggle-vis" onclick="togglePwVis('unlockInput',this)">👁</button>
        </div>
        <div class="pw-error" id="unlockError">❌ Mật khẩu không đúng!</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeUnlockModal()">Hủy</button>
      <button class="btn btn-gold" onclick="tryUnlock()">Mở Khóa ✓</button>
    </div>
  </div>
</div>

<!-- VIEW MODAL -->
<div class="modal-bg hidden" id="viewModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title" id="viewTitle">...</span>
      <button class="close-btn" onclick="closeViewModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Mô Tả</label>
        <p id="viewDesc" style="color:var(--text2);line-height:1.8;font-weight:500"></p>
      </div>
      <div class="form-group">
        <label class="form-label">Link / Text</label>
        <div id="viewLink" style="display:flex;gap:10px;align-items:flex-start"></div>
      </div>
      <div class="form-group" id="viewTagsWrap">
        <label class="form-label">Thể Loại &amp; Tags</label>
        <div class="card-tags" id="viewTags"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="deleteBtn" onclick="deletePrompt(viewingId)" style="display:none">🗑 Xóa</button>
      <button class="btn" id="editBtn" onclick="editPrompt(viewingId)" style="display:none">✏️ Chỉnh Sửa</button>
      <button class="btn" onclick="closeViewModal()">Đóng</button>
    </div>
  </div>
</div>

<script>
const STORE_KEY = 'hospital_vault_data';
const ENCRYPTION_KEY = 'BenhVienTamThanCo';
const ADMIN_KEY = 'hospital_admin_creds';

let prompts = [];
let editingId = null;
let unlockTargetId = null;
let viewingId = null;
let sessionUnlocked = new Set();
let editGenres = [];
let editTags = [];
let isAdmin = false;
let adminEmail = null;

// ===== ADMIN AUTH =====
const ADMIN_USERS = [
  { email: 'admin@hospital.local', password: 'BenhVienAdmin2024' }
];

function loginAdmin() {
  const email = document.getElementById('adminEmailInput').value.trim();
  const password = document.getElementById('adminPasswordInput').value;
  const errorEl = document.getElementById('adminLoginError');
  
  errorEl.textContent = '';
  
  if (!email || !password) {
    errorEl.textContent = '❌ Vui lòng nhập email và mật khẩu!';
    return;
  }

  const validUser = ADMIN_USERS.find(u => u.email === email && u.password === password);
  if (!validUser) {
    errorEl.textContent = '❌ Email hoặc mật khẩu không đúng!';
    return;
  }

  isAdmin = true;
  adminEmail = email;
  localStorage.setItem(ADMIN_KEY, JSON.stringify({ email, timestamp: Date.now() }));
  
  closeAdminLoginModal();
  openAdminPanel();
  updateAdminStatus();
  showToast('✓ Đăng nhập admin thành công!', 'success');
}

function logoutAdmin() {
  if (confirm('Bạn chắc chắn muốn đăng xuất?')) {
    isAdmin = false;
    adminEmail = null;
    localStorage.removeItem(ADMIN_KEY);
    closeAdminPanel();
    updateAdminStatus();
    showToast('✓ Đã đăng xuất!', 'success');
  }
}

function updateAdminStatus() {
  const statusEl = document.getElementById('adminStatusInfo');
  if (isAdmin && adminEmail) {
    statusEl.style.display = 'flex';
    document.getElementById('adminEmail').textContent = adminEmail;
  } else {
    statusEl.style.display = 'none';
  }
}

function checkAdminSession() {
  try {
    const stored = localStorage.getItem(ADMIN_KEY);
    if (stored) {
      const data = JSON.parse(stored);
      const now = Date.now();
      const sessionAge = now - data.timestamp;
      const sessionTimeout = 24 * 60 * 60 * 1000;
      
      if (sessionAge < sessionTimeout) {
        isAdmin = true;
        adminEmail = data.email;
        return true;
      }
    }
  } catch (e) {}
  return false;
}

// ===== UI FUNCTIONS =====
function escHtml(text) {
  const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
  return text.replace(/[&<>"']/g, m => map[m]);
}

function showToast(msg, type = 'info') {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
  toast.innerHTML = `<span class="toast-icon">${icon}</span><span>${escHtml(msg)}</span>`;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('fade-out');
    setTimeout(() => toast.remove(), 300);
  }, 2800);
}

// ===== ENCRYPTION =====
function encryptPassword(plaintext) {
  return CryptoJS.AES.encrypt(plaintext, ENCRYPTION_KEY).toString();
}

function decryptPassword(encrypted) {
  try {
    return CryptoJS.AES.decrypt(encrypted, ENCRYPTION_KEY).toString(CryptoJS.enc.Utf8);
  } catch {
    return '';
  }
}

// ===== STORAGE =====
function save() {
  const dataToSave = prompts.map(p => ({
    ...p,
    password: p.password ? encryptPassword(p.password) : ''
  }));
  localStorage.setItem(STORE_KEY, JSON.stringify(dataToSave));
}

function load() {
  try {
    const stored = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    prompts = stored.map(p => ({
      ...p,
      password: p.password ? decryptPassword(p.password) : ''
    }));
  } catch {
    prompts = [];
  }
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// ===== TAGS =====
function handleTagKey(e, type) {
  if (e.key === 'Enter') { e.preventDefault(); addTag(type); }
}

function addTag(type) {
  const inp = document.getElementById(type === 'genre' ? 'fGenreInput' : 'fTagInput');
  const val = inp.value.trim();
  if (!val) return;
  const arr = type === 'genre' ? editGenres : editTags;
  if (!arr.includes(val)) { arr.push(val); renderTagPrev(type); }
  inp.value = '';
  inp.focus();
}

function removeTag(type, val) {
  if (type === 'genre') { editGenres = editGenres.filter(t => t !== val); renderTagPrev('genre'); }
  else { editTags = editTags.filter(t => t !== val); renderTagPrev('tag'); }
}

function renderTagPrev(type) {
  const arr = type === 'genre' ? editGenres : editTags;
  const prev = document.getElementById(type === 'genre' ? 'fGenrePrev' : 'fTagPrev');
  prev.innerHTML = arr.map(t => `<span class="tag-removable ${type}"><span>${escHtml(t)}</span><span class="rm" onclick="removeTag('${type}','${escHtml(t)}')">✕</span></span>`).join('');
}

// ===== MODALS =====
function toggleAdminPanel() {
  if (!isAdmin) {
    document.getElementById('adminLoginModal').classList.remove('hidden');
  } else {
    closeAdminPanel();
  }
}

function openAdminPanel() {
  document.getElementById('adminPanelModal').classList.remove('hidden');
}

function closeAdminPanel() {
  document.getElementById('adminPanelModal').classList.add('hidden');
  clearAdminForm();
}

function closeAdminLoginModal() {
  document.getElementById('adminLoginModal').classList.add('hidden');
  document.getElementById('adminEmailInput').value = '';
  document.getElementById('adminPasswordInput').value = '';
  document.getElementById('adminLoginError').textContent = '';
}

function togglePwVis(inputId, btn) {
  const inp = document.getElementById(inputId);
  if (inp.type === 'password') {
    inp.type = 'text';
    btn.textContent = '🙈';
  } else {
    inp.type = 'password';
    btn.textContent = '👁';
  }
}

function togglePwFields() {
  const chk = document.getElementById('fPwEnabled').checked;
  document.getElementById('pwFields').classList.toggle('hidden', !chk);
}

// ===== FORM =====
function clearAdminForm() {
  editingId = null;
  editGenres = [];
  editTags = [];
  document.getElementById('fName').value = '';
  document.getElementById('fLink').value = '';
  document.getElementById('fDesc').value = '';
  document.getElementById('fGenreInput').value = '';
  document.getElementById('fTagInput').value = '';
  document.getElementById('fPwEnabled').checked = false;
  document.getElementById('fPassword').value = '';
  document.getElementById('fHint').value = '';
  document.getElementById('fGenrePrev').innerHTML = '';
  document.getElementById('fTagPrev').innerHTML = '';
  togglePwFields();
  document.getElementById('saveBtnAdmin').textContent = '💾 Lưu Prompt';
}

function editPrompt(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  editGenres = [...(p.genres || [])];
  editTags = [...(p.tags || [])];
  document.getElementById('fName').value = p.name;
  document.getElementById('fLink').value = p.link;
  document.getElementById('fDesc').value = p.desc || '';
  document.getElementById('fPwEnabled').checked = !!p.password;
  document.getElementById('fPassword').value = p.password || '';
  document.getElementById('fHint').value = p.hint || '';
  renderTagPrev('genre');
  renderTagPrev('tag');
  togglePwFields();
  closeViewModal();
  openAdminPanel();
  document.getElementById('saveBtnAdmin').textContent = '✏️ Cập Nhật Prompt';
}

function savePrompt() {
  if (!isAdmin) {
    showToast('❌ Bạn cần đăng nhập admin!', 'error');
    return;
  }

  const name = document.getElementById('fName').value.trim();
  const link = document.getElementById('fLink').value.trim();
  if (!name || !link) {
    showToast('❌ Vui lòng nhập tên và link!', 'error');
    return;
  }

  const desc = document.getElementById('fDesc').value.trim();
  const pw = document.getElementById('fPwEnabled').checked ? document.getElementById('fPassword').value : '';
  const hint = document.getElementById('fHint').value.trim();

  if (editingId) {
    const idx = prompts.findIndex(p => p.id === editingId);
    if (idx !== -1) {
      prompts[idx] = {
        ...prompts[idx],
        name, link, desc, password: pw, hint,
        genres: editGenres, tags: editTags,
        updatedAt: new Date().toISOString()
      };
    }
  } else {
    prompts.push({
      id: genId(),
      name, link, desc, password: pw, hint,
      genres: editGenres, tags: editTags,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    });
  }

  save();
  renderPrompts();
  clearAdminForm();
  closeAdminPanel();
  showToast(editingId ? '✓ Cập nhật thành công!' : '✓ Thêm mới thành công!', 'success');
}

function deletePrompt(id) {
  if (!isAdmin) {
    showToast('❌ Bạn cần đăng nhập admin!', 'error');
    return;
  }
  if (confirm('Bạn chắc chắn muốn xóa prompt này?')) {
    prompts = prompts.filter(p => p.id !== id);
    save();
    renderPrompts();
    closeViewModal();
    showToast('✓ Xóa thành công!', 'success');
  }
}

// ===== VIEWING =====
function openViewModal(id) {
  const p = prompts.find(x => x.id === id);
  if (!p) return;
  viewingId = id;
  
  document.getElementById('viewTitle').textContent = p.name;
  document.getElementById('viewDesc').textContent = p.desc || '(Không có mô tả)';
  
  const linkDiv = document.getElementById('viewLink');
  const isUrl = p.link.startsWith('http://') || p.link.startsWith('https://');
  if (isUrl) {
    linkDiv.innerHTML = `<a href="${escHtml(p.link)}" target="_blank" style="color:var(--primary-light);text-decoration:underline;flex:1;word-break:break-all">${escHtml(p.link)}</a><button class="btn btn-sm" onclick="copyToClip('${escHtml(p.link)}')">📋</button>`;
  } else {
    linkDiv.innerHTML = `<div class="prompt-text-display" style="flex:1">${escHtml(p.link)}</div><button class="btn btn-sm" onclick="copyToClip('${escHtml(p.link)}')">📋</button>`;
  }
  
  const tagsHtml = [
    ...(p.genres || []).map(t => `<span class="tag-pill genre">${escHtml(t)}</span>`),
    ...(p.tags || []).map(t => `<span class="tag-pill tag">${escHtml(t)}</span>`)
  ].join('');
  document.getElementById('viewTags').innerHTML = tagsHtml || '(Không có tags)';
  
  const editBtn = document.getElementById('editBtn');
  const deleteBtn = document.getElementById('deleteBtn');
  if (isAdmin) {
    editBtn.style.display = 'block';
    deleteBtn.style.display = 'block';
  } else {
    editBtn.style.display = 'none';
    deleteBtn.style.display = 'none';
  }
  
  document.getElementById('viewModal').classList.remove('hidden');
}

function closeViewModal() {
  document.getElementById('viewModal').classList.add('hidden');
}

function copyToClip(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('✓ Đã sao chép!', 'success');
  }).catch(() => {
    showToast('❌ Sao chép thất bại!', 'error');
  });
}

// ===== PASSWORD UNLOCK =====
function openUnlockModal(id) {
  const p = prompts.find(x => x.id === id);
  if (!p || !p.password) return;
  unlockTargetId = id;
  document.getElementById('unlockBotName').textContent = p.name;
  const hintWrap = document.getElementById('unlockHintWrap');
  if (p.hint) {
    hintWrap.textContent = `💡 Gợi ý: ${p.hint}`;
    hintWrap.style.display = 'block';
  } else {
    hintWrap.style.display = 'none';
  }
  document.getElementById('unlockInput').value = '';
  document.getElementById('unlockError').classList.remove('show');
  document.getElementById('unlockModal').classList.remove('hidden');
}

function closeUnlockModal() {
  document.getElementById('unlockModal').classList.add('hidden');
  unlockTargetId = null;
}

function tryUnlock() {
  if (!unlockTargetId) return;
  const p = prompts.find(x => x.id === unlockTargetId);
  if (!p || !p.password) return;
  
  const entered = document.getElementById('unlockInput').value;
  if (entered === p.password) {
    sessionUnlocked.add(unlockTargetId);
    closeUnlockModal();
    renderPrompts();
    showToast('✓ Đã mở khóa!', 'success');
  } else {
    document.getElementById('unlockError').classList.add('show');
  }
}

// ===== RENDERING =====
function renderPrompts() {
  const searchText = document.getElementById('searchInput').value.toLowerCase();
  const sortVal = document.getElementById('sortSelect').value;
  
  let filtered = prompts.filter(p => {
    const matchText = p.name.toLowerCase().includes(searchText) || 
                      (p.desc || '').toLowerCase().includes(searchText) ||
                      p.link.toLowerCase().includes(searchText);
    return matchText;
  });

  filtered.sort((a, b) => {
    if (sortVal === 'newest') return new Date(b.createdAt) - new Date(a.createdAt);
    if (sortVal === 'oldest') return new Date(a.createdAt) - new Date(b.createdAt);
    if (sortVal === 'name') return a.name.localeCompare(b.name);
  });

  const grid = document.getElementById('promptsGrid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><h3>Không có prompts</h3><p>Hãy thêm prompts mới để bắt đầu!</p></div>';
  } else {
    grid.innerHTML = filtered.map(p => {
      const isLocked = p.password && !sessionUnlocked.has(p.id);
      const lockStatusHtml = isLocked ? '<span class="lock-status">🔒 Đang Khóa</span>' : '';
      const cardContent = `
        <div class="card-top">
          <div style="flex:1">
            <div class="card-name">${escHtml(p.name)}</div>
            ${lockStatusHtml}
          </div>
        </div>
        <div class="card-desc">${escHtml(p.desc || '(Không có mô tả)')}</div>
        <div class="card-tags">
          ${(p.genres || []).map(t => `<span class="tag-pill genre">${escHtml(t)}</span>`).join('')}
          ${(p.tags || []).map(t => `<span class="tag-pill tag">${escHtml(t)}</span>`).join('')}
        </div>
      `;
      
      if (isLocked) {
        return `<div class="prompt-card" onclick="openUnlockModal('${p.id}')">${cardContent}</div>`;
      } else {
        return `<div class="prompt-card" onclick="openViewModal('${p.id}')">${cardContent}</div>`;
      }
    }).join('');
  }

  document.getElementById('countBadge').textContent = filtered.length;
}

// ===== INIT =====
function init() {
  load();
  checkAdminSession();
  updateAdminStatus();
  renderPrompts();
  
  if (prompts.length === 0) {
    prompts = [
      {
        id: genId(),
        name: 'Cố Lăng Hiên',
        link: 'https://example.com/prompt1',
        desc: 'Một prompt tuyệt vời về nhân vật cố lăng hiên',
        genres: ['Nhân Vật', 'Lịch Sử'],
        tags: ['Điểm Danh', 'Quan Trọng'],
        password: 'test123',
        hint: 'Tên con vật đầu tiên',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      }
    ];
    save();
    renderPrompts();
  }
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
